services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  # Saved recipe pages for Import: E2E (see compose.e2e.yaml) and `just seed` only.
  fixtures:
    profiles: [fixtures]
    image: nginx:1.29-alpine
    volumes:
      - ./fixtures:/usr/share/nginx/html:ro
      - ./docker/fixtures.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:8081:80'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1/e2e/placeholder.html',
        ]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    profiles: [app]
    build:
      context: ./backend
    # .env carries the optional Llm__* overrides and the OpenRouter key; not used in CI.
    env_file:
      - path: .env
        required: false
    # Host Ollama stays bound to 127.0.0.1; this name reaches it via the host gateway.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      ConnectionStrings__Db: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${API_PORT:-5080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/health']
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    profiles: [app]
    build:
      context: ./frontend
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
