# E2E override for `just test-e2e`, run as its own compose project (recipejoe-e2e): own containers
# and database volume, only web published, so it runs alongside `just dev` without touching its data.
services:
  postgres:
    ports: !reset []
  fixtures:
    ports: !reset []
  # Stands in for OpenRouter: answers every chat request with one Recipe titled like the video.
  llm:
    image: wiremock/wiremock:3.13.1
    volumes:
      - ./docker/wiremock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/__admin/health']
      interval: 2s
      timeout: 3s
      retries: 15
  backend:
    environment:
      # Reachable as http://fixtures (port 80 inside the compose network); exempt from the SSRF guard.
      Import__AllowedHosts__0: fixtures
      # The slow-recipe page lives on WireMock (llm): its fixed delay keeps an Import Pending long enough to observe.
      Import__AllowedHosts__1: llm
      # No YouTube, no paid calls: recorded videos in, WireMock as the LLM.
      VideoSource__Provider: Fake
      VideoSource__FakeDirectory: /fixtures/videos
      Llm__Provider: OpenRouter
      Llm__BaseUrl: http://llm:8080/v1
      Llm__ApiKey: e2e-not-a-secret
    volumes:
      - ./fixtures/e2e/videos:/fixtures/videos:ro
    depends_on:
      fixtures:
        condition: service_healthy
      llm:
        condition: service_healthy
    ports: !reset []
  web:
    ports: !override
      - '127.0.0.1:${E2E_WEB_PORT:-8090}:80'
