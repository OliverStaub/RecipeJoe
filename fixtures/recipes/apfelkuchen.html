<!-- Variant: single Recipe object; instructions as string[]; hour+minute durations; numeric yield -->
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Einfacher Apfelkuchen</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Recipe",
    "name": "Einfacher Apfelkuchen",
    "recipeYield": 12,
    "prepTime": "PT20M",
    "cookTime": "PT1H",
    "recipeIngredient": ["4 Äpfel", "200 g Mehl", "150 g Zucker", "3 Eier", "1 Päckchen Backpulver"],
    "recipeInstructions": [
      "Äpfel schälen und in Scheiben schneiden.",
      "Teig aus Mehl, Zucker, Eiern und Backpulver rühren.",
      "Äpfel unterheben und 1 Stunde bei 180 °C backen."
    ]
  }
  </script>
</head>
<body><h1>Einfacher Apfelkuchen</h1></body>
</html>
