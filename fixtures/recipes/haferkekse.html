<!-- Variant: top-level array of nodes; recipeYield as QuantitativeValue -->
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Haferkekse</title>
  <script type="application/ld+json">
[
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Testküche"
  },
  {
    "@context": "https://schema.org",
    "@type": "Recipe",
    "name": "Haferkekse",
    "recipeYield": {
      "@type": "QuantitativeValue",
      "value": "24",
      "unitText": "Stück"
    },
    "recipeIngredient": [
      "200 g Haferflocken",
      "100 g Butter",
      "80 g Zucker"
    ],
    "recipeInstructions": [
      "Zutaten verkneten.",
      "Kekse formen und 12 Minuten backen."
    ]
  }
]
  </script>
</head>
<body><h1>Haferkekse</h1></body>
</html>
